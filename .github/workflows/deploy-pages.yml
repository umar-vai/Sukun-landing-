name: Deploy SukunLife landing page

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare enhanced static site
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          sha = os.environ.get('GITHUB_SHA', 'latest')[:12]
          css = f'<link rel="stylesheet" href="enhance.css?v={sha}">'
          glass = f'<link rel="stylesheet" href="glass-tune.css?v={sha}">'
          js = f'<script src="enhance.js?v={sha}"></script>'

          if 'enhance.css' not in html:
              html = html.replace('</head>', f'  {css}\n</head>')
          if 'glass-tune.css' not in html:
              html = html.replace('</head>', f'  {glass}\n</head>')
          if 'enhance.js' not in html:
              html = html.replace('</body>', f'  {js}\n</body>')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
